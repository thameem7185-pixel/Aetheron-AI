document.addEventListener('visibilitychange', () => { if (!document.hidden && isThinking) holdAwake(); });

const sleep = ms => new Promise(r => setTimeout(r, ms));
function waitOnline(max) {
  if (navigator.onLine) return Promise.resolve();
  return new Promise(res => {
    const t = setTimeout(res, max);
    window.addEventListener('online', () => { clearTimeout(t); res(); }, { once: true });
  });
}
function setThinkNote(el, text) {
  if (!el || !el.isConnected) return;
  let n = el.querySelector('.think-note');
  if (!n) { n = document.createElement('div'); n.className = 'think-note'; el.appendChild(n); }
  n.textContent = text;
}

async function fetchWithRetry(message, signal, onWait) {
  let last;
  for (let n = 1; n <= MAX_TRIES; n++) {
    try {
      await waitOnline(60000);
      const resp = await fetch(WORKER_URL, {
        method: 'POST', signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, systemPrompt: getSystemPrompt(), stream: true })
      });
      if (resp.ok) return resp;
      const err = await resp.json().catch(() => ({}));
      last = new Error(err?.message || err?.error || `HTTP ${resp.status}`);
      last.status = resp.status;
      if (!RETRY_STATUS.has(resp.status)) { last.fatal = true; throw last; }
    } catch (e) {
      if (e.fatal || e.name === 'AbortError') throw e;
      last = last && e === last ? last : e;
    }
    if (n < MAX_TRIES) { if (onWait) onWait(n + 1); await sleep(Math.min(1500 * 2 ** (n - 1), 10000)); }
  }
  throw last || new Error('network');
}

async function readStream(resp, onText) {
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let got = '';
  const visible = t => { const i = t.lastIndexOf('\n[[AETHERON'); return i >= 0 ? t.slice(0, i) : t; };
  try {
    for (;;) {
      await pauseGate();
      const { done, value } = await reader.read();
      if (done) break;
      got += dec.decode(value, { stream: true });
      onText(visible(got));
    }
    got += dec.decode();
  } catch (e) {
    return { text: visible(got), end: e.name === 'AbortError' ? 'aborted' : 'dropped' };
  }
  const m = got.match(DONE_RE);
  return m ? { text: got.replace(DONE_RE, ''), end: m[1] === 'length' ? 'length' : 'stop' }
           : { text: got, end: 'dropped' };
}

function joinContinuation(a, b) {
  const max = Math.min(300, a.length, b.length);
  for (let k = max; k >= 12; k--) if (a.endsWith(b.slice(0, k))) return a + b.slice(k);
  return a + b;
}
function buildContinuePrompt(original, soFar) {
  return original +
    '\n\n---\nYour previous reply was cut off before it finished. This is the last part you wrote:\n<<<\n' +
    soFar.slice(-2500) +
    '\n>>>\nContinue EXACTLY from the last character: do not repeat anything, no preamble, no explanation. ' +
    'If you were inside a code block, keep going inside it and close it when the code is complete.';
}

/* streaming bubble with smooth tick-based pacing, pause & Continue support */
function createLiveMessage() {
  const win = document.getElementById('chat-window');
  const sendBtn = document.getElementById('send-btn');
  const sendHtml = sendBtn.innerHTML;
  const div = document.createElement('div');
  div.className = 'msg assistant generating';
  const uid = ++msgUid;
  rawMessageStore[uid] = '';
  div.innerHTML = `<div class="bubble"></div>
    <div class="live-note" hidden></div>
    <button class="continue-btn" hidden onclick="resumeGeneration()">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="15" height="15"><path d="M8 5.5v13l11-6.5z"/></svg>
      Continue
    </button>
    <div class="msg-actions pending">
      <button class="icon-btn sm" onclick="copyMessageText(this, ${uid})" title="Copy" aria-label="Copy">${ICON_COPY}</button>
      <button class="icon-btn sm msg-speak-btn" onclick="speakMessage(this, ${uid})" title="Read aloud" aria-label="Read aloud">${ICON_SPEAK}</button>
    </div>`;
  win.appendChild(div);
  const bubble = div.querySelector('.bubble'), note = div.querySelector('.live-note'), actions = div.querySelector('.msg-actions');
  const stream = makeStream(bubble);
  win.style.scrollBehavior = 'auto';

  isTyping = true; skipTyping = false;
  sendBtn.innerHTML = ICON_STOP_TYPING; sendBtn.disabled = false; sendBtn.title = 'Stop';

  let target = '', shown = 0, acc = 0, lastT = 0, running = false, dead = false, ending = null;
  function restoreButton() { sendBtn.innerHTML = sendHtml; sendBtn.title = 'Send'; isTyping = false; skipTyping = false; win.style.scrollBehavior = ''; }

  function complete() {
    const text = ending.text;
    stream.render(text, true);
    if (stickBottom) win.scrollTop = win.scrollHeight;
    rawMessageStore[uid] = text;
    note.hidden = true;
    actions.classList.remove('pending'); div.classList.remove('generating');
    restoreButton();
    if (autoVoiceMode) speakText(text, div.querySelector('.msg-speak-btn'));
    running = false; ending.resolve();
  }

  function tick(now) {
    if (dead) { running = false; return; }
    if (genPaused) { running = false; lastT = 0; return; }
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
    const text = ending ? ending.text : target;
    if (shown > text.length) shown = text.length;
    const backlog = text.length - shown;
    if (backlog > 0) {
      if (skipTyping) shown = text.length;
      else {
        const cps = Math.min(3000, Math.max(30, backlog * 3));
        acc += cps * dt;
        const n = Math.floor(acc); acc -= n;
        shown = Math.min(text.length, shown + n);
        const c = text.charCodeAt(shown - 1);
        if (c >= 0xD800 && c <= 0xDBFF && shown < text.length) shown++;
      }
      stream.render(text.slice(0, shown), false);
      if (stickBottom) win.scrollTop = win.scrollHeight;
    }
    if (ending && shown >= text.length) { complete(); return; }
    if (!ending && shown >= target.length) { running = false; lastT = 0; acc = 0; return; }
    requestAnimationFrame(tick);
  }
  function kick() { if (!running && !dead && !genPaused) { running = true; lastT = 0; acc = 0; requestAnimationFrame(tick); } }

  return {
    update(text) { target = text; kick(); },
    note(msg) { note.hidden = !msg; note.textContent = msg || ''; },
    kick,
    finish(text) {
      return new Promise(resolve => {
        target = text; ending = { text, resolve };
        if (document.hidden) { shown = text.length; complete(); return; }
        kick();
      });
    },
    remove() { dead = true; div.remove(); restoreButton(); }
  };
}

async function callCohere() {
  setBusy(true); holdAwake();
  const thinkingEl = showThinking();
  currentThinkingEl = thinkingEl;
  const t0 = Date.now();
  const tick = setInterval(() => {
    if (genPaused) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    if (s >= 8) setThinkNote(thinkingEl, `Still working… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` +
      (s >= 45 ? ' · long replies can take a few minutes, keep this tab open' : ''));
  }, 1000);
  const ctrl = new AbortController();
  currentAbort = ctrl;
  const original = messages[messages.length - 1]?.content || '';
  let live = null, full = '', pushed = false, incomplete = false;

  const keep = () => { if (pushed || !full) return; pushed = true; messages.push({ role: 'assistant', content: full }); msgCount++; };

  try {
    let message = original, rounds = 0;
    for (;;) {
      const resp = await fetchWithRetry(message, ctrl.signal, n => {
        if (genPaused) return;
        const txt = `Connection hiccup — retrying (${n}/${MAX_TRIES})…`;
        if (live) live.note(txt); else setThinkNote(thinkingEl, txt);
      });
      if (live) live.note('');

      const ct = resp.headers.get('content-type') || '';
      if (/json/i.test(ct) || !resp.body) {
        const data = await resp.json().catch(() => null);
        if (data === null) { if (!live) { thinkingEl.remove(); showError('The reply came back unreadable. Please try again.'); return; } incomplete = true; break; }
        const text = typeof data === 'string' ? data : (data.text || data.message || JSON.stringify(data));
        if (!live) {
          thinkingEl.remove();
          messages.push({ role: 'assistant', content: text }); pushed = true; msgCount++;
          await typeMessage(text);
          return;
        }
        full = joinContinuation(full, text);
        break;
      }

      if (!live) { thinkingEl.remove(); live = createLiveMessage(); currentLive = live; }
      const base = full;
      const r = await readStream(resp, t => live.update(base ? joinContinuation(base, t) : t));
      full = base ? joinContinuation(base, r.text) : r.text;
      live.update(full);
      if (r.end === 'stop' || r.end === 'aborted') break;

      if (++rounds > MAX_CONTINUES) { incomplete = true; break; }
      live.note(r.end === 'length' ? 'Reply is long — continuing…' : 'Connection interrupted — resuming…');
      await sleep(800);
      message = full ? buildContinuePrompt(original, full) : original;
    }

    if (live) {
      if (full) { await live.finish(full); keep(); if (incomplete) showToast('The reply may be incomplete — tap Continue to resume'); }
      else live.remove();
    }
  } catch (e) {
    thinkingEl.remove();
    if (live) { if (full) { await live.finish(full); keep(); } else live.remove(); }
    if (e.name === 'AbortError') {
      /* user pressed Stop — keep whatever arrived */
    } else if (e.fatal) {
      showError(`Something went wrong (${e.message}).`);
    } else if (e.status === 524 || e.status === 504) {
      showError(`The server timed out (HTTP ${e.status}) on a long reply. Tap Retry — and make sure the Worker streams its answer (see worker.js).`);
    } else {
      const m = (!navigator.onLine || e.message === 'offline')
        ? 'No internet connection. Check your network and tap Retry.'
        : "Couldn't reach the server after several tries. Check your connection and tap Retry.";
      showError(m);
    }
  } finally {
    clearInterval(tick);
    currentAbort = null;
    currentThinkingEl = null;
    currentLive = null;
    releaseAwake();
    setBusy(false);
  }
}
function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function showThinking() {
  const el = document.createElement('div');
  el.className = 'msg assistant generating';
  el.innerHTML = '<div class="think-ball"><span class="type-ball"></span></div>';
  document.getElementById('chat-window').appendChild(el);
  scrollDown();
  return el;
}

function appendMessage(role, content, isError = false) {
  const win = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const uid = ++msgUid;
  rawMessageStore[uid] = content;
  div.dataset.uid = uid;

  if (role === 'user') {
    div.innerHTML = `<div class="bubble">${escHtml(content)}</div>`;
    attachLongPress(div);
  } else {
    div.innerHTML = `
      <div class="bubble${isError ? ' error' : ''}">${isError ? escHtml(content) : renderMarkdown(content)}</div>
      ${isError ? '' : `<div class="msg-actions">
        <button class="icon-btn sm" onclick="copyMessageText(this, ${uid})" title="Copy" aria-label="Copy">${ICON_COPY}</button>
        <button class="icon-btn sm msg-speak-btn" onclick="speakMessage(this, ${uid})" title="Read aloud" aria-label="Read aloud">${ICON_SPEAK}</button>
      </div>`}`;
  }
  win.appendChild(div);
  scrollDown();
  if (role === 'assistant' && !isError && autoVoiceMode) {
    speakText(content, div.querySelector('.msg-speak-btn'));
  }
  return div;
}

function speakMessage(btn, uid) { speakText(rawMessageStore[uid] ?? '', btn); }

function copyMessageText(btn, uid) {
  copyToClipboard(rawMessageStore[uid] ?? '').then(() => {
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('copied'); }, 1600);
    showToast('Copied');
  }).catch(() => showToast('Copy failed'));
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand failed'));
    } catch (err) { reject(err); }
  });
}

function scrollDown() {
  const win = document.getElementById('chat-window');
  stickBottom = true;
  win.scrollTop = win.scrollHeight;
}

const CA_ICON = {
  run:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
  dl:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>'
};

function codeBlockHtml(langAttr, rawCode) {
  const id = 'code-' + Math.random().toString(36).slice(2);
  codeSnippetStore[id] = rawCode;
  const isHtml = ['html', 'htm', 'xhtml'].includes(langAttr) ||
    (langAttr === 'txt' && /^\s*(<!doctype html|<html[\s>])/i.test(rawCode));
  const run = isHtml
    ? `<button class="ca-btn run-btn" onclick="runCode('${id}')" aria-label="Run">${CA_ICON.run}<span class="lbl">Run</span></button>` : '';
  const html = `<div class="code-wrap">
        <div class="code-actions">
          <span class="code-lang">${isHtml ? 'html' : escHtml(langAttr)}</span>
          ${run}
          <button class="ca-btn dl-btn" onclick="downloadCode('${id}','${isHtml ? 'html' : langAttr}')" aria-label="Download">${CA_ICON.dl}<span class="lbl">Download</span></button>
          <button class="ca-btn copy-btn" onclick="copyCode('${id}', this)" aria-label="Copy">${CA_ICON.copy}<span class="lbl">Copy</span></button>
        </div>
        <pre id="${id}" data-lang="${langAttr}"><code>${escHtml(rawCode)}</code></pre>
      </div>`;
  return { id, html };
}

function renderMarkdown(text) {
  let codeBlocks = [];
  let processedText = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
    const langAttr = (lang || 'txt').toLowerCase();
    const rawCode = code.replace(/^\n+|\n+$/g, '');
    const cb = codeBlockHtml(langAttr, rawCode);
    const placeholder = `___CODE_BLOCK_${codeBlocks.length}___`;
    codeBlocks.push({ placeholder: placeholder, html: cb.html });
    return placeholder;
  });
  let html = escHtml(processedText);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/<\/li>\n(?=<li>)/g, '</li>');
  html = html.replace(/(?:<li>.*?<\/li>)+/g, m => '<ul>' + m + '</ul>');
  html = html.replace(/(<\/(?:h1|h2|h3|ul|blockquote)>|<hr>)\n/g, '$1');
  codeBlocks.forEach(item => { html = html.replace(item.placeholder, item.html); });
  return html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyCode(id, btn) {
  const code = codeSnippetStore[id] ?? '';
  copyToClipboard(code).then(() => {
    showToast('Code copied');
    if (btn) {
      const l = btn.querySelector('.lbl');
      const original = l ? l.textContent : '';
      btn.classList.add('done');
      if (l) l.textContent = 'Copied';
      setTimeout(() => { btn.classList.remove('done'); if (l) l.textContent = original; }, 1600);
    }
  }).catch(() => showToast('Copy failed'));
}

const EXT_MAP = {
  javascript: 'js', js: 'js', typescript: 'ts', ts: 'ts',
  python: 'py', py: 'py', html: 'html', css: 'css',
  json: 'json', java: 'java', c: 'c', cpp: 'cpp', 'c++': 'cpp',
  csharp: 'cs', 'c#': 'cs', go: 'go', golang: 'go', rust: 'rs',
  php: 'php', ruby: 'rb', swift: 'swift', kotlin: 'kt',
  sql: 'sql', bash: 'sh', sh: 'sh', shell: 'sh', yaml: 'yml',
  yml: 'yml', xml: 'xml', markdown: 'md', md: 'md', txt: 'txt'
};

function downloadCode(id, lang) {
  const content = codeSnippetStore[id] ?? '';
  const ext = EXT_MAP[lang] || 'txt';
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${APP_NAME.toLowerCase()}_snippet_${Date.now()}.${ext}`;
  document.body.appendChild(a);
  a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  showToast('Downloaded');
}

function clearChat() {
  cancelGeneration();
  stopSpeaking();
  messages = [];
  msgCount = 0;
  totalTokens = 0;
  renderWelcome();
  closeSidebarOnMobile();
  showToast('New chat');
}

function exportChat() {
  if (!messages.length) { showToast('Nothing to export'); return; }
  const txt = messages.map(m => `[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n' + '─'.repeat(60) + '\n\n');
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${APP_NAME.toLowerCase()}_chat_${Date.now()}.txt`;
  a.click();
  closeSidebarOnMobile();
  showToast('Exported');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* long-press on user messages */
let lpTimer = null, lpStart = null, msgMenuEl = null;
const userTextStore = {};

function attachLongPress(el) {
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    lpStart = { x: e.clientX, y: e.clientY };
    clearTimeout(lpTimer);
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      showMsgMenu(el, lpStart.x, lpStart.y);
    }, 460);
  });
  el.addEventListener('pointermove', e => {
    if (!lpTimer || !lpStart) return;
    if (Math.abs(e.clientX - lpStart.x) > 10 || Math.abs(e.clientY - lpStart.y) > 10) {
      clearTimeout(lpTimer); lpTimer = null;
    }
  });
  ['pointerup', 'pointercancel'].forEach(ev =>
    el.addEventListener(ev, () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } })
  );
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    showMsgMenu(el, e.clientX, e.clientY);
  });
}

function hideMsgMenu() {
  if (msgMenuEl) { msgMenuEl.remove(); msgMenuEl = null; }
  document.removeEventListener('pointerdown', docDownHideMenu, true);
}
function docDownHideMenu(e) {
  if (msgMenuEl && !msgMenuEl.contains(e.target)) hideMsgMenu();
}
function showMsgMenu(el, x, y) {
  hideMsgMenu();
  const menu = document.createElement('div');
  menu.className = 'msg-menu';
  menu.innerHTML = `
    <button data-act="select">${svgIcon('<path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><path d="M8 12h8"/>')} Select text</button>
    <button data-act="copy">${ICON_COPY} Copy message</button>
    <button data-act="edit">${svgIcon('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>')} Edit message</button>`;
  document.body.appendChild(menu);
  const mw = menu.offsetWidth || 180, mh = menu.offsetHeight || 140;
  const left = Math.max(8, Math.min(x, window.innerWidth - mw - 8));
  const top = Math.max(8, Math.min(y, window.innerHeight - mh - 8));
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  msgMenuEl = menu;
  menu.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    hideMsgMenu();
    if (act === 'select') selectMsgText(el);
    else if (act === 'copy') copyMsgText(el);
    else if (act === 'edit') editMsgText(el);
  });
  setTimeout(() => document.addEventListener('pointerdown', docDownHideMenu, true), 0);
}
function selectMsgText(el) {
  const bubble = el.querySelector('.bubble');
  if (!bubble) return;
  try {
    const range = document.createRange();
    range.selectNodeContents(bubble);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    showToast('Text selected');
  } catch (e) { showToast('Could not select text'); }
}
function copyMsgText(el) {
  const uid = el.dataset.uid;
  const text = (uid && rawMessageStore[uid]) || el.querySelector('.bubble')?.textContent || '';
  copyToClipboard(text).then(() => showToast('Copied')).catch(() => showToast('Copy failed'));
}
function editMsgText(el) {
  const idx = parseInt(el.dataset.msgIndex, 10);
  if (isNaN(idx) || !messages[idx]) return;
  cancelGeneration();
  const text = userTextStore[el.dataset.uid] ?? '';
  messages.splice(idx);
  const toRemove = [];
  let node = el;
  while (node) { if (node.classList && node.classList.contains('msg')) toRemove.push(node); node = node.nextElementSibling; }
  toRemove.forEach(n => n.remove());
  const input = document.getElementById('msg-input');
  input.value = text;
  autoResize(input);
  input.focus();
  if (!messages.length) renderWelcome();
  else scrollDown();
  showToast('Editing message');
}

/* liquid-glass pointer light */
(function () {
  const SEL = '#sidebar,#topbar,#input-bar,.msg .bubble,.chip,.new-chat,.mode-btn,.row-btn,.retry-btn,.attach-chip';
  let busy = false;
  document.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' || busy) return;
    busy = true;
    requestAnimationFrame(() => {
      busy = false;
      const el = e.target.closest && e.target.closest(SEL);
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  }, { passive: true });
})();

/* stick-to-bottom tracking */
(function () {
  const win = document.getElementById('chat-window');
  win.addEventListener('scroll', () => {
    stickBottom = win.scrollHeight - win.scrollTop - win.clientHeight < 120;
  }, { passive: true });
})();

/* HTML runner sidebar */
function toggleSidebarRunner(force) {
  const wrap = document.getElementById('sb-runner');
  if (!wrap) return;
  const open = typeof force === 'boolean' ? force : !wrap.classList.contains('open');
  wrap.classList.toggle('open', open);
  const head = wrap.querySelector('.sb-runner-head');
  if (head) {
    head.setAttribute('aria-expanded', String(open));
    head.title = open ? 'Collapse HTML runner' : 'Expand HTML runner';
  }
}
function runPastedHtml() {
  const ta = document.getElementById('sb-html-input');
  const code = ta ? ta.value.trim() : '';
  if (!code) { showToast('Paste some HTML first'); return; }
  const id = 'pasted-' + Date.now();
  codeSnippetStore[id] = code;
  runCode(id);
  if (window.innerWidth < 860) { toggleSidebarRunner(false); toggleSidebar(false); }
}

var runnerId = null;
var RUNNER_SHIM = '<script>(function(){function mk(){var d={};return{getItem:function(k){return k in d?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}["localStorage","sessionStorage"].forEach(function(n){try{window[n].getItem("x")}catch(e){try{Object.defineProperty(window,n,{value:mk(),configurable:true})}catch(_){}}})})();<\/script>';
function buildRunnerDoc(code) {
  var m = code.match(/<head[^>]*>/i) || code.match(/<html[^>]*>/i);
  if (m) return code.replace(m[0], function (t) { return t + RUNNER_SHIM; });
  return RUNNER_SHIM + code;
}
function runCode(id) {
  var code = codeSnippetStore[id];
  if (code == null) return;
  runnerId = id;
  var t = code.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  document.getElementById('runner-title').textContent = (t && t[1].trim()) || 'Preview';
  document.getElementById('runner-frame').srcdoc = buildRunnerDoc(code);
  var r = document.getElementById('runner');
  r.classList.add('open'); r.setAttribute('aria-hidden', 'false');
  document.body.classList.add('runner-open');
  if (window.innerWidth < 860) closeSidebarOnMobile();
}
function closeRunner() {
  var r = document.getElementById('runner');
  r.classList.remove('open'); r.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('runner-open');
  document.getElementById('runner-frame').srcdoc = '';
}
function runnerReload() {
  var f = document.getElementById('runner-frame'), code = codeSnippetStore[runnerId];
  if (code == null) return;
  f.srcdoc = ''; setTimeout(function () { f.srcdoc = buildRunnerDoc(code); }, 30);
  showToast('Reloaded');
}
function runnerDownload() { if (runnerId) downloadCode(runnerId, 'html'); }
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.getElementById('runner').classList.contains('open')) closeRunner();
});

/* Settings sheet */
(function () {
  var overlay = document.getElementById('settings-overlay');
  if (!overlay) return;
  window.openSettings = function () {
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    closeSidebarOnMobile();
  };
  window.closeSettings = function () {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
  };
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSettings(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeSettings();
  });
})();

/* Lighting panel */
(function () {
  var card = document.getElementById('light-panel');
  if (!card) return;
  var $ = function (s) { return card.querySelector(s); };
  var PRESETS = {
    Glass:   { refraction: 50, depth: 50, dispersion: 50, frost: 33, angle: 0,   bright: 100 },
    Plastic: { refraction: 15, depth: 30, dispersion: 25, frost: 65, angle: -30, bright: 85  },
    Metal:   { refraction: 85, depth: 75, dispersion: 85, frost: 8,  angle: 35,  bright: 125 }
  };
  var KEY = 'aetheron-light';
  var cfg = Object.assign({}, PRESETS.Glass), preset = 'Glass';
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.cfg) { cfg = Object.assign(cfg, saved.cfg); if (PRESETS[saved.preset]) preset = saved.preset; }
  } catch (e) {}

  var sliders = card.querySelectorAll('.custom-slider');
  var angleIn = $('#lp-angle'), brightIn = $('#lp-bright');
  var torch = $('#lp-torch'), spot = $('#lp-spot'), preview = $('#lp-preview');

  function clamp(v, a, b) { v = Number(v); if (isNaN(v)) v = 0; return Math.min(b, Math.max(a, v)); }

  function paintUI() {
    sliders.forEach(function (s) {
      var k = s.getAttribute('data-k');
      s.value = cfg[k];
      var o = card.querySelector('[data-v="' + k + '"]'); if (o) o.textContent = Math.round(cfg[k]);
    });
    if (document.activeElement !== angleIn) angleIn.value = Math.round(cfg.angle);
    if (document.activeElement !== brightIn) brightIn.value = Math.round(cfg.bright);
    var a = cfg.angle * Math.PI / 180;
    torch.style.transform = 'rotate(' + (-140 + cfg.angle) + 'deg)';
    var x = 50 + 38 * Math.sin(a), y = 50 - 38 * Math.cos(a);
    spot.style.background = 'radial-gradient(circle at ' + x + '% ' + y + '%, rgba(255,255,255,.6), transparent 58%)';
    spot.style.opacity = clamp(cfg.bright / 100, 0, 1.5);
    $('#lp-title').textContent = preset;
    card.querySelectorAll('.dropdown-item').forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-preset') === preset);
    });
  }

  function apply() {
    if (window.setLight) window.setLight({
      distortion: cfg.refraction / 100 * 0.1,
      yScale:     0.1 + cfg.depth / 100 * 0.8,
      xScale:     0.4 + cfg.dispersion / 100 * 1.2,
      angle:      cfg.angle * Math.PI / 180,
      bright:     cfg.bright / 100
    });
    document.documentElement.style.setProperty('--blur', (cfg.frost * 0.3).toFixed(1) + 'px');
    paintUI();
    try { localStorage.setItem(KEY, JSON.stringify({ cfg: cfg, preset: preset })); } catch (e) {}
  }

  sliders.forEach(function (s) {
    s.addEventListener('input', function () { cfg[s.getAttribute('data-k')] = Number(s.value); apply(); });
  });
  angleIn.addEventListener('input', function () { cfg.angle = clamp(angleIn.value, -180, 180); apply(); });
  brightIn.addEventListener('input', function () { cfg.bright = clamp(brightIn.value, 0, 150); apply(); });
  [angleIn, brightIn].forEach(function (el) { el.addEventListener('blur', paintUI); });

  var dragging = false;
  function aim(e) {
    var r = preview.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (!dx && !dy) return;
    cfg.angle = Math.round(Math.atan2(dx, -dy) * 180 / Math.PI);
    apply();
  }
  preview.addEventListener('pointerdown', function (e) { dragging = true; try { preview.setPointerCapture(e.pointerId); } catch (_) {} aim(e); });
  preview.addEventListener('pointermove', function (e) { if (dragging) aim(e); });
  ['pointerup', 'pointercancel'].forEach(function (n) { preview.addEventListener(n, function () { dragging = false; }); });

  var toggle = $('#lp-toggle');
  card.querySelectorAll('.dropdown-item').forEach(function (it) {
    it.addEventListener('click', function () {
      var name = it.getAttribute('data-preset');
      if (!PRESETS[name]) return;
      preset = name; cfg = Object.assign({}, PRESETS[name]);
      toggle.checked = false; apply();
    });
  });
  document.addEventListener('click', function (e) {
    if (toggle.checked && !e.target.closest('#light-panel .header-dropdown-container')) toggle.checked = false;
  });

  var btn = $('#lp-collapse');
  btn.addEventListener('click', function () {
    var c = card.classList.toggle('collapsed');
    btn.textContent = c ? '＋' : '✕';
    btn.setAttribute('aria-expanded', String(!c));
    btn.setAttribute('aria-label', c ? 'Expand lighting panel' : 'Collapse lighting panel');
  });

  apply();
})();
</script>
