<style>
  :root {
    color-scheme: light;
    --bg: #dff8f5;
    --bg-grad: linear-gradient(160deg, #eafffc 0%, #d2f5f1 50%, #dff9ff 100%);
    --text: #052e2e;
    --muted: #4a7a78;
    --accent: #0a9a93;
    --accent-soft: rgba(20,184,166,.16);
    --on-grad: #03302e;
    --grad: linear-gradient(135deg, #5eead4 0%, #22d3ee 55%, #2dd4bf 100%);
    --grad-text: linear-gradient(120deg, #0d9488 0%, #06b6d4 50%, #10b981 100%);
    --blur: 22px;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.62), rgba(255,255,255,.22));
    --glass-line: rgba(255,255,255,.7);
    --glass-edge: rgba(255,255,255,.95);
    --glass-edge-dim: rgba(255,255,255,.35);
    --glass-shade: rgba(6,95,92,.14);
    --spec: rgba(255,255,255,.65);
    --drop: rgba(8,110,106,.16);
    --glass-shadow: inset 0 1px 0 var(--glass-edge), inset 1px 0 0 var(--glass-edge-dim), inset 0 -1px 0 var(--glass-shade), 0 10px 34px var(--drop);
    --hover: rgba(255,255,255,.38);
    --hover-strong: rgba(255,255,255,.6);
    --line: rgba(255,255,255,.6);
    --surface: rgba(255,255,255,.7);
    --surface-2: rgba(255,255,255,.4);
    --user-bubble: linear-gradient(135deg, rgba(94,234,212,.42), rgba(34,211,238,.22));
    --code-bg: rgba(255,255,255,.5);
    --danger: #e0526b;
    --chip-1: rgba(45,212,191,.22);  --chip-1-t: #0f766e;
    --chip-2: rgba(34,211,238,.2);   --chip-2-t: #0e7490;
    --chip-3: rgba(110,231,183,.26); --chip-3-t: #047857;
    --b1: #2dd4bf; --b2: #22d3ee; --b3: #a7f3d0; --blob-o: .6;
    --shadow: 0 2px 6px rgba(8,110,106,.06), 0 14px 40px rgba(8,110,106,.14);
    --sidebar-w: 268px;
    --font: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #031a1d;
    --bg-grad: linear-gradient(160deg, #021416 0%, #042b2e 55%, #03222b 100%);
    --text: #e4fffb; --muted: #82b5b1;
    --accent: #4de3d0; --accent-soft: rgba(77,227,208,.16); --on-grad: #022b2a;
    --glass-bg: linear-gradient(135deg, rgba(150,255,240,.13), rgba(150,255,240,.035));
    --glass-line: rgba(160,255,240,.2);
    --glass-edge: rgba(190,255,248,.4);
    --glass-edge-dim: rgba(190,255,248,.1);
    --glass-shade: rgba(0,0,0,.35);
    --spec: rgba(170,255,245,.17); --drop: rgba(0,0,0,.42);
    --hover: rgba(160,255,240,.09); --hover-strong: rgba(160,255,240,.17);
    --line: rgba(160,255,240,.16);
    --surface: rgba(10,50,54,.7); --surface-2: rgba(160,255,240,.08);
    --user-bubble: linear-gradient(135deg, rgba(45,212,191,.32), rgba(34,211,238,.15));
    --code-bg: rgba(0,22,26,.5);
    --danger: #ff7f95;
    --chip-1: rgba(45,212,191,.2);  --chip-1-t: #8ff5e6;
    --chip-2: rgba(34,211,238,.17); --chip-2-t: #8aeaff;
    --chip-3: rgba(110,231,183,.17);--chip-3-t: #a6f3cf;
    --b1: #0d9488; --b2: #0891b2; --b3: #14b8a6; --blob-o: .5;
    --shadow: 0 2px 6px rgba(0,0,0,.3), 0 14px 40px rgba(0,0,0,.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::selection { background: rgba(45,212,191,.35); }

  html, body {
    height: 100%; font-family: var(--font); color: var(--text);
    background: var(--bg-grad); background-attachment: fixed;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  svg { display: block; }

  #shader-bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; }

  #sidebar, #topbar, #input-bar, #toast,
  .msg.user .bubble, .msg.assistant .bubble:not(.error), .think-ball,
  .chip, .attach-chip, .retry-btn {
    background: radial-gradient(240px circle at var(--mx, 18%) var(--my, 0%), var(--spec), transparent 65%), var(--glass-bg);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(1.8);
    backdrop-filter: blur(var(--blur)) saturate(1.8);
    border: 1px solid var(--glass-line);
    box-shadow: var(--glass-shadow);
  }

  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    margin: 12px 0 12px calc(-1 * (var(--sidebar-w) + 12px));
    border-radius: 28px; display: flex; flex-direction: column;
    padding: 14px 12px 12px;
    transition: margin-left .3s cubic-bezier(.3,.8,.3,1), transform .3s cubic-bezier(.3,.8,.3,1);
    z-index: 30;
  }
  body.sidebar-open #sidebar { margin-left: 12px; }

  .sb-head { display: none; align-items: center; justify-content: space-between; padding: 4px 6px 14px 8px; }
  .brand { font-weight: 650; font-size: 1.05rem; letter-spacing: .1px; display: inline-flex; align-items: center; gap: 9px; }
  .brand::before {
    content: ''; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), rgba(255,255,255,0) 45%), var(--grad);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), inset -2px -3px 6px rgba(255,255,255,.35), 0 2px 10px rgba(20,184,166,.45);
  }

  .new-chat {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 12px 14px; margin: 4px 0 22px;
    border-radius: 18px; color: var(--on-grad);
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%), var(--grad);
    border: 1px solid rgba(255,255,255,.55);
    font-size: .93rem; font-weight: 650;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 8px 22px rgba(20,184,166,.38);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .new-chat:hover { filter: brightness(1.05); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 28px rgba(20,184,166,.5); }
  .new-chat:active { transform: scale(.98); }

  .sb-label { font-size: .7rem; color: var(--muted); padding: 0 14px 8px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }

  .mode-btn, .row-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left;
    padding: 11px 14px; margin-bottom: 3px; border-radius: 16px;
    font-size: .93rem; color: var(--text);
    border: 1px solid transparent;
    transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
  }
  .mode-btn:hover, .row-btn:hover {
    background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 50%), var(--spec), transparent 70%), var(--hover);
    border-color: var(--glass-line);
  }
  .mode-btn.active {
    background: linear-gradient(135deg, var(--accent-soft), rgba(255,255,255,.06));
    border-color: var(--glass-line); color: var(--accent); font-weight: 650;
    box-shadow: inset 0 1px 0 var(--glass-edge-dim);
  }

  .sb-spacer { flex: 1; }
  .sb-foot { border-top: 1px solid var(--line); padding-top: 10px; }

  .switch {
    width: 40px; height: 24px; border-radius: 12px; position: relative; flex-shrink: 0;
    background: var(--hover-strong); border: 1px solid var(--glass-line);
    box-shadow: inset 0 1px 3px rgba(0,60,60,.18);
    transition: background .25s;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(180deg, #fff, #d9fffa);
    transition: transform .25s cubic-bezier(.3,.8,.3,1);
    box-shadow: 0 1px 4px rgba(0,70,70,.35), inset 0 1px 0 #fff;
  }
  .switch.on { background: var(--grad); border-color: rgba(255,255,255,.5); }
  .switch.on::after { transform: translateX(16px); }

  #scrim { display: none; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #topbar {
    margin: calc(10px + env(safe-area-inset-top)) 12px 0;
    height: 54px; padding: 0 8px;
    border-radius: 22px;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    z-index: 5;
  }
  #topbar .brand { font-size: 1rem; }
  #topbar .spacer { flex: 1; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); flex-shrink: 0;
    border: 1px solid transparent;
    transition: background .2s, color .2s, transform .15s, border-color .2s, box-shadow .2s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--accent); border-color: var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-edge-dim); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-btn.sm { width: 30px; height: 30px; }

  #chat-window {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px 18px 24px;
    display: flex; flex-direction: column;
    scroll-behavior: smooth;
  }
  #chat-window::-webkit-scrollbar { width: 6px; }
  #chat-window::-webkit-scrollbar-thumb { background: var(--glass-line); border-radius: 3px; }

  #welcome { margin: auto; text-align: center; padding: 0 8px 6vh; max-width: 620px; animation: rise .6s ease both; }
  .orb {
    width: 88px; height: 88px; margin: 0 auto 26px; border-radius: 50%;
    background: radial-gradient(circle at 30% 24%, rgba(255,255,255,.95), rgba(255,255,255,0) 40%),
      radial-gradient(circle at 72% 86%, rgba(255,255,255,.4), rgba(255,255,255,0) 42%),
      conic-gradient(from 200deg, #5eead4, #22d3ee, #a7f3d0, #2dd4bf, #67e8f9, #5eead4);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset -8px -10px 22px rgba(255,255,255,.28), 0 18px 46px rgba(20,184,166,.45);
    animation: float 5s ease-in-out infinite;
  }
  :root[data-theme="dark"] .orb { box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), inset -8px -10px 22px rgba(255,255,255,.2), 0 0 64px rgba(45,212,191,.5), 0 0 130px rgba(34,211,238,.22); }
  @keyframes float { 50% { transform: translateY(-8px) scale(1.03); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #welcome h1 {
    font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.15;
    background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    background-size: 220% 100%; animation: shimmer 8s ease-in-out infinite alternate;
    margin-bottom: 10px;
  }
  :root[data-theme="dark"] #welcome h1 { background-image: linear-gradient(120deg, #5eead4 0%, #67e8f9 50%, #a7f3d0 100%); filter: drop-shadow(0 0 18px rgba(45,212,191,.3)); }
  @keyframes shimmer { to { background-position: 100% 0; } }
  #welcome .sub { color: var(--muted); font-size: 1rem; margin-bottom: 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    --t: var(--chip-1); color: var(--chip-1-t);
    padding: 11px 18px; border-radius: 999px;
    font-size: .9rem; font-weight: 550;
    background: radial-gradient(200px circle at var(--mx, 18%) var(--my, 0%), var(--spec), transparent 65%),
      linear-gradient(135deg, var(--t), transparent 85%), var(--glass-bg);
    transition: transform .18s, box-shadow .18s;
  }
  .chip:nth-child(2) { --t: var(--chip-2); color: var(--chip-2-t); }
  .chip:nth-child(3) { --t: var(--chip-3); color: var(--chip-3-t); }
  .chip:hover { transform: translateY(-2px); }
  .chip:active { transform: scale(.97); }

  .msg { width: 100%; max-width: 760px; margin: 0 auto 20px; display: flex; flex-direction: column; animation: rise .35s ease both; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: radial-gradient(240px circle at var(--mx, 80%) var(--my, 0%), var(--spec), transparent 65%), var(--user-bubble);
    border-radius: 22px 22px 6px 22px; padding: 11px 18px;
    max-width: 85%; white-space: pre-wrap; word-break: break-word; line-height: 1.55;
    -webkit-user-select: text; user-select: text;
  }
  .msg.assistant { position: relative; padding-left: 34px; }
  .msg.assistant .bubble { border-radius: 22px 22px 22px 8px; line-height: 1.72; font-size: 1rem; white-space: pre-wrap; word-break: break-word; padding: 12px 18px; }
  .bubble.error {
    color: var(--danger); padding: 10px 14px; border-radius: 16px;
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
  }

  .bubble h1, .bubble h2, .bubble h3 { font-weight: 650; margin: 16px 0 4px; line-height: 1.3; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 2px; }
  .bubble h1 { font-size: 1.3rem; } .bubble h2 { font-size: 1.15rem; } .bubble h3 { font-size: 1.05rem; }
  .bubble ul { margin: 6px 0 6px 1.3em; white-space: normal; }
  .bubble li { margin: 3px 0; }
  .bubble li::marker { color: var(--accent); }
  .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 6px 0; }
  .bubble hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .bubble a { color: var(--accent); }
  .bubble code { font-family: var(--mono); font-size: .88em; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 7px; }

  /* streaming: cheap while a reply is being written */
  body.busy .msg.assistant.generating .bubble { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(9,9,11,.9); }
  .bubble .blk > h1:first-child, .bubble .blk > h2:first-child, .bubble .blk > h3:first-child { margin-top: 16px; }
  .bubble > .blk:first-child > h1:first-child, .bubble > .blk:first-child > h2:first-child, .bubble > .blk:first-child > h3:first-child { margin-top: 2px; }

  .code-wrap {
    background: var(--code-bg); border: 1px solid var(--glass-line); border-radius: 18px;
    margin: 12px 0; overflow: hidden; white-space: normal;
    box-shadow: inset 0 1px 0 var(--glass-edge-dim), 0 6px 20px var(--drop);
  }
  /* code actions: Run · Download · Copy, always one tidy row */
  .code-actions { display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex-wrap: nowrap; border-bottom: 1px solid var(--line); background: var(--hover); }
  .code-actions .code-lang { margin-right: auto; padding-left: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .code-actions .ca-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-width: 34px; padding: 0 12px; flex: 0 0 auto;
    border-radius: 10px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.05);
    color: var(--text); font-size: .78rem; font-weight: 550; line-height: 1;
  }
  .code-actions .ca-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .code-actions .ca-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
  .code-actions .ca-btn:active { transform: scale(.96); }
  .code-actions .run-btn, .code-actions .run-btn:hover { background: #fff; color: #000; border-color: #fff; font-weight: 650; }
  .code-actions .ca-btn.done, .code-actions .ca-btn.done:hover { background: #fff; color: #000; border-color: #fff; }
  @media (max-width: 520px) {
    .code-actions .ca-btn { height: 36px; }
    .code-actions .ca-btn:not(.run-btn) { padding: 0; width: 36px; }
    .code-actions .ca-btn:not(.run-btn) .lbl { display: none; }
  }
  .code-wrap pre { padding: 15px; overflow-x: auto; white-space: pre; tab-size: 2; }
  .code-wrap pre code { background: none; color: var(--text); padding: 0; font-size: .85rem; line-height: 1.6; }

  .msg-actions { display: flex; gap: 2px; margin-top: 6px; margin-left: 6px; opacity: .55; transition: opacity .15s; }
  .msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
  .msg-actions .icon-btn.copied, .msg-actions .icon-btn.speaking { color: var(--accent); background: var(--accent-soft); }

  .dots { display: flex; gap: 6px; padding: 12px 0; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--grad); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: scale(.7); } 40% { opacity: 1; transform: scale(1.1); } }

  #composer-wrap { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); flex-shrink: 0; }

  #attachments-row { display: none; max-width: 760px; margin: 0 auto 10px; flex-wrap: wrap; gap: 6px; }
  #attachments-row.show { display: flex; }
  .attach-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 6px 5px 13px; color: var(--accent); border-radius: 999px; font-size: .8rem; max-width: 100%; }
  .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  .chip-remove { width: 20px; height: 20px; border-radius: 50%; color: var(--accent); font-size: .7rem; }
  .chip-remove:hover { background: var(--hover-strong); }

  #input-bar {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 2px;
    border-radius: 30px; padding: 7px 8px 7px 10px;
    --blur: 26px;
    transition: border-color .2s, box-shadow .2s;
  }
  #input-bar:focus-within { border-color: var(--accent); box-shadow: var(--glass-shadow), 0 0 0 4px rgba(45,212,191,.2); }
  #msg-input {
    flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
    font: inherit; font-size: 16px; line-height: 1.5; color: var(--text);
    padding: 9px 6px; max-height: 160px;
  }
  #msg-input::placeholder { color: var(--muted); }
  #attach-btn.has-files { color: var(--accent); }
  #mic-btn.recording { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  #send-btn {
    color: var(--on-grad);
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%), var(--grad);
    border-color: rgba(255,255,255,.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 4px 16px rgba(20,184,166,.45);
  }
  #send-btn:hover { color: var(--on-grad); background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%), var(--grad); filter: brightness(1.07); }
  #send-btn:disabled { background: var(--hover); color: var(--muted); filter: none; opacity: 1; box-shadow: none; border-color: transparent; }
  :root[data-theme="dark"] #send-btn:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 22px rgba(45,212,191,.5); }

  #toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    color: var(--text);
    padding: 9px 18px; border-radius: 999px; font-size: .85rem; font-weight: 550;
    transition: opacity .2s, transform .2s; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sb-runner { margin-top: 4px; }
  .sb-runner-title { display: inline-flex; align-items: center; gap: 9px; }
  .sb-runner-head { cursor: pointer; }
  .sb-runner-head .chev { flex-shrink: 0; color: var(--muted); transition: transform .25s ease, color .25s ease; }
  .sb-runner.open .sb-runner-head .chev { transform: rotate(180deg); color: var(--accent); }
  .sb-runner-body { display: none; padding: 4px 2px 2px; }
  .sb-runner.open .sb-runner-body { display: block; animation: rise .22s ease both; }

  #sb-html-input {
    display: block; width: 100%; min-height: 120px; max-height: 260px; resize: vertical;
    background: var(--code-bg); color: var(--text);
    border: 1px solid rgba(127,127,127,.28); border-radius: 12px;
    padding: 10px 12px; font-family: var(--mono); font-size: .8rem; line-height: 1.55;
    outline: none; transition: border-color .18s, box-shadow .18s; -webkit-appearance: none;
  }
  #sb-html-input::placeholder { color: var(--muted); }
  #sb-html-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.set-head { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 12px 8px 12px 18px; border-bottom: 1px solid var(--line, #27272a); }
.set-title { font-weight: 650; font-size: 1rem; letter-spacing: .2px; }
.set-head .icon-btn { margin-left: auto; }
.set-body { padding: 14px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.set-body .glass-card { margin: 0; }
.set-note { font-size: .78rem; color: var(--muted); line-height: 1.5; padding: 2px 4px 0; }

@media (max-width: 520px) {
  #settings-overlay { padding: 0; align-items: flex-end; }
  #settings-panel { width: 100%; max-height: 56vh; border-radius: 18px 18px 0 0; border-bottom: 0; transform: translateY(100%); }
  #settings-overlay.open #settings-panel { transform: none; }
}

.switch::after, :root[data-theme="dark"] .switch::after { box-sizing: border-box; top: 50%; left: 2px; width: 18px; height: 18px; transform: translateY(-50%); }
.switch.on::after, :root[data-theme="dark"] .switch.on::after { transform: translate(16px, -50%); }
.think-note, .live-note { font-size: .78rem; color: var(--muted); margin: 8px 6px 0; line-height: 1.4; }
.live-note[hidden] { display: none; }

  /* ═══ Long-press message menu (transparent) ═══ */
  .msg-menu {
    position: fixed; z-index: 1300; min-width: 176px;
    padding: 6px; display: flex; flex-direction: column; gap: 2px;
    border-radius: 16px;
    background: rgba(18,18,22,.42);
    -webkit-backdrop-filter: blur(26px) saturate(1.7);
    backdrop-filter: blur(26px) saturate(1.7);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 14px 44px rgba(0,0,0,.5);
    animation: menuIn .14s ease both;
  }
  @keyframes menuIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .msg-menu button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; border-radius: 12px;
    font-size: .92rem; text-align: left; color: var(--text);
    background: transparent;
    transition: background .14s;
  }
  .msg-menu button:hover, .msg-menu button:active { background: rgba(255,255,255,.12); }
  .msg-menu button svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }

  /* ═══ Continue button (transparent pill) ═══ */
  .continue-btn {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 10px; padding: 8px 18px 8px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.2);
    color: var(--text);
    font-size: .86rem; font-weight: 600;
    transition: background .15s, border-color .15s, transform .12s;
  }
  .continue-btn:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); }
  .continue-btn:active { transform: scale(.96); }
  .continue-btn svg { width: 15px; height: 15px; }
  .continue-btn[hidden] { display: none; }

  /* ═══ Phones: chat fills the screen ═══ */
  @media (max-width: 859px) {
    #chat-window { padding: 10px 6px 14px; }
    .msg { max-width: none; margin-bottom: 14px; }
    .msg.assistant { padding-left: 0; }
    .msg.assistant::before { display: none; }
    .msg.assistant .bubble { border-radius: 16px; padding: 12px 14px; }
    .msg.user .bubble { max-width: 96%; }
    #composer-wrap { padding: 0 8px calc(10px + env(safe-area-inset-bottom)); }
    .msg-actions { margin-left: 2px; gap: 4px; }
    .msg-actions .icon-btn.sm { width: 36px; height: 36px; }
    #topbar { margin-inline: 6px; margin-top: calc(6px + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>
<canvas id="shader-bg" aria-hidden="true"></canvas>

<div id="runner" aria-hidden="true">
  <div class="rn-bar">
    <span class="rn-title" id="runner-title">Preview</span>
    <span class="rn-spacer"></span>
    <button class="rn-icon" onclick="runnerReload()" title="Reload" aria-label="Reload preview">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="rn-icon" onclick="runnerDownload()" title="Download" aria-label="Download HTML">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
    <button class="rn-icon close" onclick="closeRunner()" title="Close" aria-label="Close preview">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <iframe id="runner-frame" title="HTML preview"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads"
    referrerpolicy="no-referrer"></iframe>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="brand" data-app-name></span>
      <button class="icon-btn sb-close" onclick="toggleSidebar(false)" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <button class="new-chat" onclick="clearChat()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="sb-label">Mode</div>
    <button class="mode-btn active" data-mode="chat" onclick="setMode('chat')">General</button>
    <button class="mode-btn" data-mode="code" onclick="setMode('code')">Code</button>
    <button class="mode-btn" data-mode="complex" onclick="setMode('complex')">Deep think</button>

    <div class="sb-label" style="margin-top:6px;">Tools</div>
    <div class="sb-runner" id="sb-runner">
      <button class="row-btn sb-runner-head" onclick="toggleSidebarRunner()" aria-expanded="false" aria-controls="sb-runner-body" title="Expand HTML runner">
        <span class="sb-runner-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          HTML Runner
        </span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="sb-runner-body" id="sb-runner-body">
        <textarea id="sb-html-input" spellcheck="false" placeholder="Paste HTML here, then hit Run — the preview opens on the right."></textarea>
        <button class="sb-run-btn" onclick="runPastedHtml()">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Run it
        </button>
      </div>
    </div>

    <div class="sb-spacer"></div>

    <div class="sb-foot">
      <button class="row-btn" onclick="toggleTheme()" role="switch" aria-checked="false" id="theme-row">
        Dark mode <span class="switch" id="theme-switch"></span>
      </button>
      <button class="row-btn" onclick="toggleAutoVoice()" role="switch" aria-checked="false" id="voice-row">
        Voice replies <span class="switch" id="voice-toggle"></span>
      </button>
      <button class="row-btn" onclick="openSettings()">
        Settings
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="row-btn" onclick="exportChat()">Export chat</button>
    </div>
  </aside>
  <div id="scrim" onclick="toggleSidebar(false)"></div>

  <div id="main">
    <header id="topbar">
      <button class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="brand" data-app-name></span>
      <span class="spacer"></span>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme"></button>
      <button class="icon-btn" onclick="clearChat()" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      </button>
    </header>

    <div id="chat-window"></div>

    <div id="composer-wrap">
      <div id="attachments-row"></div>
      <div id="input-bar">
        <input type="file" id="file-input" multiple hidden onchange="handleFileSelect(event)">
        <button class="icon-btn" id="attach-btn" onclick="openFileDrawer()" title="Attach files" aria-label="Attach files">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
        </button>
        <textarea id="msg-input" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="icon-btn" id="mic-btn" onclick="toggleRecording()" title="Voice input" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="icon-btn" id="send-btn" onclick="onSendClick()" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="settings-overlay" aria-hidden="true">
  <div id="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="set-head">
      <span class="set-title">Settings</span>
      <button class="icon-btn" onclick="closeSettings()" aria-label="Close settings">

      </button>
    </div>

    <div class="set-body">

          <div class="header-dropdown-container">

              <div class="icon-circle"></div>

                </span>
                <input id="lp-bright" type="number" min="0" max="150" step="5" value="100" aria-label="Light brightness in percent" /><span>%</span>
              </div>
            </div>
          </div>
        </div>

        <hr class="divider" />

        <div class="sliders-container">
          <div class="slider-row">

              <div class="slider-divider"></div>
              <span class="slider-value" data-v="refraction">50</span>
            </div>
          </div>
          <div class="slider-row">
            <label for="lp-depth">Depth</label>
            <div class="slider-content">
              <div class="slider-wrapper"><input id="lp-depth" type="range" class="custom-slider" data-k="depth" min="0" max="100" value="50" /></div>
              <div class="slider-divider"></div>
              <span class="slider-value" data-v="depth">50</span>
            </div>
          </div>

/* background shader */
(function () {
  const cv = document.getElementById('shader-bg');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false });
  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
  window.syncParticles = function () {};
  window.setLight = function () {};
  window.__shaderBusy = false;
  if (!gl) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  const fs = `
    precision highp float;
    uniform vec2 resolution; uniform float time; uniform float dark;
    uniform float xScale; uniform float yScale; uniform float distortion;
    uniform float angle; uniform float bright;
    void main(){
      vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
      float ca = cos(angle), sa = sin(angle);
      p = mat2(ca, -sa, sa, ca) * p;
      float d = length(p) * distortion;
      float rx = p.x * (1.0 + d), gx = p.x, bx = p.x * (1.0 - d);
      vec3 v = vec3(
        0.05 / abs(p.y + sin((rx + time) * xScale) * yScale),
        0.05 / abs(p.y + sin((gx + time) * xScale) * yScale),
        0.05 / abs(p.y + sin((bx + time) * xScale) * yScale));
      v = clamp(v, 0.0, 1.0);
      float vig = 1.0 - 0.35 * smoothstep(0.6, 1.8, length(p));
      gl_FragColor = vec4(v * 0.8 * bright * vig, 1.0);
    }`;

  function sh(type, src) { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U('resolution'), uTime = U('time'), uDark = U('dark');
  gl.uniform1f(U('xScale'), 1.0);
  gl.uniform1f(U('yScale'), 0.5);
  gl.uniform1f(U('distortion'), 0.05);
  gl.uniform1f(U('angle'), 0.0);
  gl.uniform1f(U('bright'), 1.0);
  const uX = U('xScale'), uY = U('yScale'), uD = U('distortion'), uA = U('angle'), uB = U('bright');
  window.setLight = function (o) {
    if (o.xScale != null) gl.uniform1f(uX, o.xScale);
    if (o.yScale != null) gl.uniform1f(uY, o.yScale);
    if (o.distortion != null) gl.uniform1f(uD, o.distortion);
    if (o.angle != null) gl.uniform1f(uA, o.angle);
    if (o.bright != null) gl.uniform1f(uB, o.bright);
    render();
  };

  let raf = 0, t = 0, last = 0, lastDraw = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cv.width = Math.round(window.innerWidth * dpr);
    cv.height = Math.round(window.innerHeight * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uRes, cv.width, cv.height);
    render();
  }
  function render() {
    gl.uniform1f(uTime, t);

    render();
    raf = requestAnimationFrame(frame);

    else if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', sync);

function handleFileSelect(event) {
  const files = Array.from(event.target.files || []);
  files.forEach(file => {

    const entry = { name: file.name, size: file.size, content: '', isText, loaded: !isText };
    attachedFiles.push(entry);
    if (isText) {
      if (file.size > MAX_FILE_SIZE) {
        entry.content = ''; entry.loaded = true; entry.tooLarge = true;
      } else {
        const reader = new FileReader();
        reader.onload = e => { entry.content = e.target.result; entry.loaded = true; renderAttachments(); };
        reader.onerror = () => { entry.loaded = true; entry.tooLarge = true; renderAttachments(); };
        reader.readAsText(file);
      }
    }
  });
  renderAttachments();
  event.target.value = '';
  showToast(files.length === 1 ? 'File attached' : files.length + ' files attached');

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = 'en-US';

  rec.onstart = () => {
    isRecording = true;
    const btn = document.getElementById('mic-btn');
    btn.classList.add('recording');
    btn.innerHTML = ICON_STOP;
  };

  rec.onresult = (e) => {
    let finalTranscript = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTranscript += t; else interim += t;
    }
    const input = document.getElementById('msg-input');
    input.value = (finalTranscript || interim).trim();
    autoResize(input);
    if (finalTranscript) rec._gotFinal = true;
  };

  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showToast('Microphone access denied');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') showToast('Voice input error: ' + e.error);
  };

  rec.onend = () => {
    isRecording = false;
    const btn = document.getElementById('mic-btn');
    btn.classList.remove('recording');
    btn.innerHTML = ICON_MIC;
    if (rec._gotFinal && document.getElementById('msg-input').value.trim()) {
      rec._gotFinal = false;
      sendMessage();
    }
  };
  return rec;
}

  p.catch(() => ttsCache.delete(text));

}

function playJarvis(buffer, myId) {
  return new Promise(resolve => {
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = 0.86;
    const f = (type, freq, gain, q) => {
      const n = audioCtx.createBiquadFilter();
      n.type = type; n.frequency.value = freq; n.gain.value = gain; if (q) n.Q.value = q;
      return n;
    };
    const chest = f('lowshelf', 170, 9);
    const body  = f('peaking', 105, 4, 1.1);
    const warm  = f('peaking', 2200, 2.5, 0.8);
    const soft  = f('highshelf', 6500, -3);
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -22; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    const master = audioCtx.createGain(); master.gain.value = 1.15;
    const delay = audioCtx.createDelay(0.1); delay.delayTime.value = 0.011;
    const fb = audioCtx.createGain(); fb.gain.value = 0.25;
    const wet = audioCtx.createGain(); wet.gain.value = 0.14;
    src.connect(chest); chest.connect(body); body.connect(warm); warm.connect(soft); soft.connect(comp);
    comp.connect(master);
    comp.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(master);
    master.connect(audioCtx.destination);
    currentAudioSource = src;
    src.onended = () => resolve();
    src.start(0);
  });
}

function splitChunks(clean) {
  const parts = clean.match(/[^.!?\n]+[.!?]*\s*/g) || [clean];
  const chunks = [];
  let cur = '';
  for (const p of parts) {
    if (chunks.length === 0 && cur === '') {
      let first = p.trim(), rest = '';
      if (first.length > 80) {
        let cut = first.lastIndexOf(' ', 80);
        if (cut < 30) cut = 80;
        rest = first.slice(cut) + ' ';
        first = first.slice(0, cut);
      }
      chunks.push(first); cur = rest; continue;
    }
    if (cur && (cur + p).length > 200) { chunks.push(cur.trim()); cur = p; } else cur += p;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks.filter(Boolean);
}

async function speakFree(chunks, myId, state) {
  const ahead = 2;
  const tasks = [];
  for (let i = 0; i < Math.min(ahead, chunks.length); i++) tasks[i] = fetchTTS(chunks[i]);
  for (let i = 0; i < chunks.length; i++) {
    if (i + ahead < chunks.length) tasks[i + ahead] = fetchTTS(chunks[i + ahead]);
    const buf = await Promise.race([
      tasks[i],
      new Promise((_, rej) => setTimeout(() => rej(new Error('TTS timeout')), i === 0 ? 3000 : 6000))
    ]);
    if (myId !== speakId) return;
    await playJarvis(buf, myId);
    if (myId !== speakId) return;
    state.done = i + 1;
  }
}

async function speakText(text, btn) {
  const wasSpeakingThis = currentSpeakingBtn === btn && (currentAudioSource || speechSynthesis.speaking);
  const hadSpeech = speechSynthesis.speaking || speechSynthesis.pending;
  stopSpeaking();
  const myId = speakId;
  if (wasSpeakingThis) return;

  const clean = stripForSpeech(text);
  if (!clean) return;

  if (btn) {
    btn.classList.add('speaking');
    btn.innerHTML = ICON_STOP;
    currentSpeakingBtn = btn;
  }
  if (hadSpeech) {
    await new Promise(r => setTimeout(r, 60));
    if (myId !== speakId) return;
  }
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}

  if (ELEVENLABS_API_KEY && ELEVENLABS_API_KEY !== "YOUR_ELEVENLABS_API_KEY") {
    try {
      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVENLABS_API_KEY },
        body: JSON.stringify({ text: clean, model_id: "eleven_monolingual_v1",
          voice_settings: { stability: 0.5, similarity_boost: 0.85 } })
      });
      if (!response.ok) throw new Error('API Request Failed');
      const audioBuffer = await audioCtx.decodeAudioData(await response.arrayBuffer());
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.onended = () => { if (myId === speakId) stopSpeaking(); };
      currentAudioSource = source;
      source.start(0);
      return;
    } catch (err) { console.warn('ElevenLabs failed, trying free voice:', err); }
  }

  const chunks = splitChunks(clean);
  const state = { done: 0 };

  try {
    await speakFree(chunks, myId, state);
    if (myId === speakId) stopSpeaking();
    return;
  } catch (err) {
    console.warn('Free voice failed, using device voice:', err);
    if (myId !== speakId) return;
  }

  if ('speechSynthesis' in window) {
    if (!jarvisVoice) jarvisVoice = pickJarvisVoice();
    const rest = chunks.slice(state.done);
    speechSynthesis.resume();
    rest.forEach((c, i) => {
      const utter = new SpeechSynthesisUtterance(c);
      if (jarvisVoice) utter.voice = jarvisVoice;
      utter.pitch = 0.45; utter.rate = 0.92;
      if (i === rest.length - 1) utter.onend = () => { if (myId === speakId) stopSpeaking(); };
      utter.onerror = (e) => { if (myId === speakId && e.error !== 'interrupted' && e.error !== 'canceled') stopSpeaking(); };
      speechSynthesis.speak(utter);
    });
  } else {
    showToast('Voice output isn\'t supported in this browser');
    stopSpeaking();
  }
}

/* incremental markdown renderer: finished blocks are committed once, only the newest is redrawn */
function makeStream(bubble) {
  let pos = 0, tail = null, tailKind = '', codeNode = null, codeId = null, codeBall = null;
  const FS = /[ \t\n]*```/y;
  let isFinal = false;

  function dropTail() {
    if (tail) { if (codeId) delete codeSnippetStore[codeId]; tail.remove(); }
    tail = null; tailKind = ''; codeNode = null; codeId = null; codeBall = null;
  }
  function commit(str) {
    dropTail();
    const d = document.createElement('div'); d.className = 'blk';
    d.innerHTML = renderMarkdown(str);
    bubble.appendChild(d);
  }
  function textTail(str) {
    if (tailKind !== 'text') {
      dropTail();
      tail = document.createElement('div'); tail.className = 'blk';
      bubble.appendChild(tail); tailKind = 'text';
    }
    tail.innerHTML = renderMarkdown(str);
    if (!isFinal) placeBall(tail);
  }
  function codeTail(lang, code) {
    if (tailKind !== 'code') {
      dropTail();
      const cb = codeBlockHtml(lang, '');
      tail = document.createElement('div'); tail.className = 'blk'; tail.innerHTML = cb.html;
      bubble.appendChild(tail);
      const codeEl = tail.querySelector('pre code');
      codeEl.textContent = '';
      codeNode = document.createTextNode('');
      codeEl.appendChild(codeNode);
      codeBall = document.createElement('span'); codeBall.className = 'type-ball';
      codeEl.appendChild(codeBall);
      codeId = cb.id; tailKind = 'code';
    }
    const clean = code.replace(/^\n+/, '');
    codeNode.data = clean;
    codeSnippetStore[codeId] = clean;
  }

  function run(text) {
    for (;;) {
      if (pos >= text.length) { dropTail(); return; }
      FS.lastIndex = pos;
      if (FS.test(text)) {
        const open = FS.lastIndex - 3;
        const nl = text.indexOf('\n', open);
        if (nl < 0) { textTail(text.slice(pos)); return; }
        const lang = (/^\w*/.exec(text.slice(open + 3, nl))[0] || 'txt').toLowerCase();
        const close = text.indexOf('\n```', nl);
        if (close < 0) { codeTail(lang, text.slice(nl + 1)); return; }
        let end = close + 4;
        const hasNl = text.charCodeAt(end) === 10;
        if (hasNl) end++;
        if (tailKind === 'code') {
          const code = text.slice(nl + 1, close).replace(/^\n+|\n+$/g, '');
          codeNode.data = code; codeSnippetStore[codeId] = code;
          if (codeBall) codeBall.remove();
          if (hasNl) tail.appendChild(document.createTextNode('\n'));
          tail = null; tailKind = ''; codeNode = null; codeId = null; codeBall = null;
        } else commit(text.slice(pos, end));
        pos = end; continue;
      }
      let end = -1;
      const nn = text.indexOf('\n\n', pos), fe = text.indexOf('\n```', pos);
      if (fe >= 0 && (nn < 0 || fe < nn)) end = fe + 1;
      else if (nn >= 0) { end = nn + 2; while (text.charCodeAt(end) === 10) end++; }
      else if (text.length - pos > 2500) { const l = text.lastIndexOf('\n'); if (l > pos) end = l + 1; }
      if (end < 0) { textTail(text.slice(pos)); return; }
      commit(text.slice(pos, end)); pos = end;
    }
  }
  function render(text, final) {
    isFinal = !!final;
    run(text);
    if (final && codeBall) { codeBall.remove(); codeBall = null; }
  }
  return { render };
}

/* animated fallback typing (non-stream JSON) — fast step-based */
function typeMessage(content) {
  return new Promise(resolve => {
    const win = document.getElementById('chat-window');

    const sendHtml = sendBtn.innerHTML;
    const div = document.createElement('div');
    div.className = 'msg assistant generating';

    div.innerHTML = `<div class="bubble"></div>
      <button class="continue-btn" hidden onclick="resumeGeneration()">

        Continue

      <div class="msg-actions pending">
        <button class="icon-btn sm" onclick="copyMessageText(this, ${uid})" title="Copy" aria-label="Copy">${ICON_COPY}</button>
        <button class="icon-btn sm msg-speak-btn" onclick="speakMessage(this, ${uid})" title="Read aloud" aria-label="Read aloud">${ICON_SPEAK}</button>
      </div>`;
    win.appendChild(div);
    const bubble = div.querySelector('.bubble');
    const actions = div.querySelector('.msg-actions');
    const stream = makeStream(bubble);

    if (autoVoiceMode) speakText(content, div.querySelector('.msg-speak-btn'));

    win.style.scrollBehavior = 'auto';

    const total = content.length;
    const step = Math.max(24, Math.ceil(total / 45));
    let shown = 0;

    function done() {
      stream.render(content, true);
      actions.classList.remove('pending');
      div.classList.remove('generating');
      if (stickBottom) win.scrollTop = win.scrollHeight;
      win.style.scrollBehavior = '';
      sendBtn.innerHTML = sendHtml;
      sendBtn.title = 'Send';
      isTyping = false; skipTyping = false;
      resolve();
    }
    function frame() {
      if (!genPaused) {
        shown = skipTyping ? total : Math.min(total, shown + step);
        if (shown >= total) { done(); return; }
        stream.render(content.slice(0, shown));
        if (stickBottom) win.scrollTop = win.scrollHeight;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

const MAX_TRIES = 5;
const MAX_CONTINUES = 8;
const RETRY_STATUS = new Set([408, 425, 429, 500, 502, 503, 504, 520, 521, 522, 523, 524, 525, 526, 527, 530]);
const DONE_RE = /\n?\[\[AETHERON_DONE:(\w+)\]\]\s*$/;
let currentAbort = null, wakeLock = null;

async function holdAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
